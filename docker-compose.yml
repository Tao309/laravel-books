services:
  db:
    container_name: laravel-books-db
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql:rw
    ports:
      - "5432:5432"
    networks:
      - laravel-books

  php:
    container_name: laravel-books-php
    build:
      context: ./docker/php-fpm
    volumes:
      - ./docker/php-fpm/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./laravel:/var/www/laravel
    networks:
      - laravel-books

  nginx:
    container_name: laravel-books-nginx
    build:
      context: ./docker/nginx
    volumes:
      - ./laravel:/var/www/laravel
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
      - db
    networks:
      - laravel-books

  redis:
    container_name: laravel-books-redis
    image: redis:latest
    ports:
      - 6379
    volumes:
      - ./redisdata:/data
    command: ["redis-server", "--bind", "redis", "--port", "6379"]
    networks:
      - laravel-books

volumes:
  pgdata:
  redisdata:

networks:
  laravel-books:
