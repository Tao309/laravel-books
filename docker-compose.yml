  db:
    container_name: laravel-books-db-mysql
    image: mysql:8.0.20
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysqldata:/var/lib/mysql:rw
    ports:
      - "3306:3306"
    networks:
      - laravel-books

  php:
    container_name: laravel-books-php
    build:
      context: ./docker/php-fpm
    volumes:
      - ./docker/php-fpm/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./laravel:/var/www/laravel
    networks:
      - laravel-books

  nginx:
    container_name: laravel-books-nginx
    build:
      context: ./docker/nginx
    volumes:
      - ./laravel:/var/www/laravel
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
      - db
    networks:
      - laravel-books

  redis:
    container_name: laravel-books-redis
    image: redis:latest
    ports:
      - 6379
    volumes:
      - ./redisdata:/data
    command: ["redis-server", "--bind", "redis", "--port", "6379"]
    networks:
      - laravel-books

volumes:
  pgdata:
  redisdata:

networks:
  laravel-books:
